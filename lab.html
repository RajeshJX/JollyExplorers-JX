"Four-stroke cycle over 720° of crank rotation: intake (valve opens, piston falls), compression (both valves closed), power (spark ignites the mix, pressure pushes the piston down), exhaust (exhaust valve opens, piston pushes gas out).",
"A crank converts rotation into straight-line motion. The slider is fastest mid-stroke and stops at the dead centres. Its travel is always 2 × crank radius. The curve below shows slider position against crank angle.",
"Each pin stack has a driver pin and a key pin. Only the correct key lifts every key pin so the gap between pins sits exactly on the shear line. Then the plug is free to turn.",
"An ultrasonic sensor sends out a high-pitched sound you can’t hear, then listens for the echo. The longer the echo takes, the farther away the object is.",
"A light sensor (LDR) is a resistor whose resistance drops when light hits it. A small circuit turns that into a number, and a rule decides when to switch the lamp on.",
"A thermistor is a resistor whose resistance changes with temperature. The controller reads it and switches the fan on when it gets too hot. The hotter it is, the faster the fan spins.",
"This robot mixes a sensor with a simple program: if the ultrasonic sensor sees something closer than its range, stop and turn. Otherwise drive forward. Sense, think, act.",
"A line-following robot has three infrared (IR) sensors that look down at the floor. A dark line absorbs light and a bright floor reflects it. If the left sensor sees the line, steer left. If the right one sees it, steer right. Each green checkpoint it crosses makes a beep.",
"A PIR (passive infrared) sensor notices the heat of a body that moves. If you stand still, it stops noticing you after a moment, so the door closes again.",
"A water pump pulls water from a well and pushes it up a pipe into a tank on the roof. Gravity then sends it down to the taps. A float switch watches the level: pump ON when the tank is low, OFF when it is full.",
"A hydraulic jack uses oil. A small push on a small piston makes pressure, and that same pressure pushes on a big piston, so a small push can lift a heavy car. The trade-off: the big piston moves only a little each push.",
"A motor turns a small crank. A link rod pushes and pulls a short lever, which swings the wiper arm back and forth. One spinning motor becomes a sweeping motion.",
"A soil moisture sensor has two metal prongs. Wet soil carries electricity better than dry soil, so the controller can measure how wet it is, show it on the screen, and sound a buzzer when the plant needs water.",
"A resistor limits the current. Ohm’s law: current = (battery voltage − LED voltage) ÷ resistance. Too little resistance means too much current, and the LED burns out.",
"In a series circuit there is only one path, so the bulbs share the battery’s push. In a parallel circuit each bulb has its own path and gets the full push.",
"The LDR and a resistor share the battery voltage (a voltage divider). When it gets dark the LDR’s resistance rises, the voltage at the transistor’s base rises, and the transistor switches the LED on.",
"A capacitor stores electric charge like a small tank. It fills slowly through a resistor and empties through the LED, which glows and fades. A bigger resistor or capacitor makes it slower. (Time is sped up here.)"];

`<h3>🌍 In real life</h3>
<p>🚗 <b>Cars, motorbikes, lawn mowers and generators</b> all have engines like this inside.</p>
<p>🗣️ <b>Remember the 4 words:</b> Suck (intake), Squeeze (compression), Bang (power), Blow (exhaust).</p>
<p>🚲 <b>Like riding a bike, backwards.</b> Your legs push the pedals down and the wheel turns. In an engine, the burning fuel pushes the piston down and the crankshaft turns the wheels.</p>
<p>🎈 <b>Squeeze a balloon</b> and the air pushes back harder. That is why squeezing the fuel mix makes the bang stronger.</p>
<div class="try">🔎 <b>Try this:</b> Slow the speed down. Which valve opens during Suck? Which one during Blow? Which stroke makes the piston go down with a big push?</div>`,
`<h3>🌍 In real life</h3>
<p>🚂 <b>Steam trains:</b> the steel rod on the side of the wheel is a crank. It turns the wheel, and the piston slides in and out.</p>

<div class="try">🔎 <b>Try this:</b> Make the crank bigger. Does the slider travel farther? Now make the rod longer. What changes on the graph?</div>`,
`<h3>🌍 In real life</h3>

<p>🔑 <b>Why do keys look different?</b> The bumps on a key are different heights. Each bump lifts one tower to the perfect height. A different key means a different pattern, so it can’t open your lock.</p>
<div class="try">🔎 <b>Try this:</b> Use the wrong key first and see which pins jam (they turn orange). Then switch to the correct key and watch them all turn green. Only try real locks that belong to you!</div>`,
`<h3>🌍 In real life</h3>
<p>🦇 <b>Bats and dolphins</b> do this naturally. They squeak, listen for the echo, and know where things are, even in the dark.</p>
<p>🚗 <b>Car parking sensors</b> beep faster as you get closer to a wall. Robot vacuums use them too, so they don’t bump into chairs.</p>

<div class="try">🔎 <b>Try this:</b> Slide the object closer and farther. What happens to the echo time? When do the bars turn red?</div>`,
`<h3>🌍 In real life</h3>

`<h3>🌍 In real life</h3>
<p>❄️ <b>Fridges and air conditioners</b> measure temperature and switch the cooling on and off for you.</p>
<p>💻 <b>Computers and game consoles</b> speed up their fans when they get hot.</p>

`<h3>🌍 In real life</h3>
<p>🧹 <b>Robot vacuums</b> drive around the room and turn when they sense a wall or a chair.</p>

<div class="try">🔎 <b>Try this:</b> Make “Sees up to” bigger. Does the robot turn earlier? Make it small and watch how close it gets. The robot now checks its whole width, so its wheels never touch the blocks.</div>`,
`<h3>🌍 In real life</h3>
<p>🏭 <b>Warehouse robots</b> follow lines on the floor to carry boxes from shelf to shelf.</p>
<p>🍽️ <b>Restaurant delivery robots</b> and toy cars use the same trick.</p>

<div class="try">🔎 <b>Try this:</b> Make the robot faster. Does it still stay on the line? Listen for the low buzz when it gets lost.</div>`,
`<h3>🌍 In real life</h3>

`<h3>🌍 In real life</h3>
<p>🏠 <b>Roof tanks</b> on houses and flats are filled by a pump, so you get water even when the pipes are empty.</p>

`<h3>🌍 In real life</h3>

`<h3>🌍 In real life</h3>

<div class="try">🔎 <b>Try this:</b> Set 12 V and a tiny resistor. The current gets too big and the LED burns out! Tap Replace LED, then find a resistor that keeps the LED bright but safe.</div>`,
`<h3>🌍 In real life</h3>
<p>🎄 <b>Old fairy lights</b> were in series: when one bulb broke, they all went out.</p>
