<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electricity World – JollyExplorers JX</title>
<style>
:root{--bg:#f6efde;--ink:#1d1b16;--muted:#6b6455;--card:#fffaf0;--accent:#f2b400;--line:#e3d8bd;--chip:#efe5cb}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--ink:#f3ecd9;--muted:#a79f8a;--card:#221f16;--accent:#ffc83d;--line:#2d2a1e;--chip:#2e2a1c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1.5px solid var(--line);background:var(--card)}
.top h1{margin:0;font-size:16px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
nav{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}
nav button{font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:#1d1b16}
.top a{font-size:12px;color:var(--muted);white-space:nowrap}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
@media (max-width:640px){.top{flex-wrap:wrap}.top a{display:none}nav{flex-basis:100%}}
</style>
</head>
<body>
<div class="top"><a href="../" style="font-size:13px;font-weight:700;color:inherit;text-decoration:none;white-space:nowrap">← JollyExplorers</a><h1>Electricity World</h1><nav id="nav"></nav><a id="full" target="_blank" rel="noopener">Open full page ↗</a></div>
<iframe id="frame" title="Simulator" loading="lazy" allow="fullscreen"></iframe>
<script>
/* To add a new simulator: put its file in /simulators and add one line here. */
var SIMS=[
  {id:"circuit",        title:"1 · Simple circuit",    file:"simulators/circuit.html"},
  {id:"series-parallel",title:"2 · Series vs parallel",file:"simulators/series-parallel.html"},
  {id:"fuse-overload",   title:"3 · Fuse & overload",   file:"simulators/fuse-overload.html"}
];
var nav=document.getElementById("nav"),frame=document.getElementById("frame"),full=document.getElementById("full");
function open(id){
  var s=SIMS.filter(function(x){return x.id===id})[0]||SIMS[0];
  frame.src=s.file;full.href=s.file;
  Array.prototype.forEach.call(nav.children,function(b){b.className=b.dataset.id===s.id?"on":""});
  try{history.replaceState(null,"","#"+s.id)}catch(e){}
}
SIMS.forEach(function(s){
  var b=document.createElement("button");b.textContent=s.title;b.dataset.id=s.id;
  b.onclick=function(){open(s.id)};nav.appendChild(b);
});
open(location.hash.slice(1));
</script>
</body>
</html>
