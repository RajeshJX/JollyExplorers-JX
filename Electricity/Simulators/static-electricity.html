<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Static Electricity</title>
<style>
:root{--bg:#f6efde;--ink:#1d1b16;--muted:#6b6455;--card:#fffaf0;--accent:#f2b400;--line:#e3d8bd;--chip:#efe5cb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--ink:#f3ecd9;--muted:#a79f8a;--card:#221f16;--accent:#ffc83d;--line:#2d2a1e;--chip:#2e2a1c}}
:root[data-theme="dark"]{--bg:#17150f;--ink:#f3ecd9;--muted:#a79f8a;--card:#221f16;--accent:#ffc83d;--line:#2d2a1e;--chip:#2e2a1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 18px 0}
h1{margin:0;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
header p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#stage{overflow:hidden;flex:1;min-height:300px;position:relative;touch-action:none;cursor:grab;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
.panel{margin:0 12px 12px;padding:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);color:#1d1b16}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slots button{font:inherit;font-weight:700;font-size:13px;padding:10px 4px;border-radius:10px;border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);cursor:pointer}
.slots button.off{opacity:.45;border-style:dashed}
.stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stats span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--chip);border:1.5px solid var(--line)}
#cap{margin:10px 2px 0;font-size:13.5px;line-height:1.5}
small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 0}
@media (min-width:700px){.panel{width:calc(100% - 24px);max-width:760px;margin-left:auto;margin-right:auto;font-size:15px}.main,.seg button{font-size:17px}.slots button{font-size:15px;padding:14px 6px}.stats span{font-size:13px}#cap{font-size:15px}h1{font-size:22px}}
@media (min-width:1000px),(min-width:700px) and (orientation:landscape){body{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,32vw,440px);grid-template-rows:auto minmax(0,1fr);overflow:hidden}header{grid-column:1/-1;padding:18px 24px 6px}#stage{min-height:0}.panel{width:auto;max-width:none;margin:12px 20px 20px 0;align-self:center;max-height:calc(100% - 32px);overflow:auto;padding:18px}}

.gauge{height:16px;border-radius:99px;background:var(--chip);border:1.5px solid var(--line);position:relative;overflow:hidden;margin-top:10px}
#fill{height:100%;width:0;background:#4caf50;transition:width .25s,background .25s}
#mark{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.main{font:inherit;font-weight:700;width:100%;padding:12px;margin-top:10px;border-radius:12px;border:2px solid var(--ink);background:var(--accent);color:#1d1b16;cursor:pointer;font-size:15px}
.main:disabled{opacity:.35}
.embedded header h1{display:none}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.row button{font:inherit;font-weight:700;font-size:14px;padding:12px 6px;border-radius:12px;border:2px solid var(--ink);background:var(--chip);color:var(--ink);cursor:pointer}.row button.on{background:var(--accent);color:#1d1b16}
</style>
</head>
<body>
<script>if(self!==top)document.documentElement.classList.add("embedded")</script>
<header><h1>How It’s Wired</h1><p>Simulator 9 · Static electricity</p></header>
<div id="stage"><div id="hint">Drag to rotate</div></div>
<div class="panel">
<button class="main" id="rub">Rub the comb on the wool</button>
<div class="lbl"><span>Bring the comb closer</span><span id="dv"></span></div>
<input type="range" id="dist" min="0" max="100" value="40">
<div class="row" style="grid-template-columns:1fr"><button id="dis">Touch it to discharge</button></div>
<div class="gauge"><div id="fill"></div></div>
<div class="stats"><span id="a"></span><span id="b"></span></div>
<p id="cap"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var stage=$('stage');
var scene=new THREE.Scene();
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
var cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
cam.position.set(9,8,9);cam.lookAt(0,0.5,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8a97c,0.85));
var sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(5,10,4);scene.add(sun);
var g=new THREE.Group();scene.add(g);
var EDGE=new THREE.LineBasicMaterial({color:0x2a2418});
function mat(c,o){return new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}))}
function add(m,x,y,z,p){m.position.set(x,y,z);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,40),EDGE));(p||g).add(m);return m}
function box(w,h,d,c,x,y,z,p){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)),x,y,z,p)}
function cyl(r,h,c,x,y,z,p){return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),mat(c)),x,y,z,p)}
var Y=0.35,CU=0xd9822b;
var sh=new THREE.Mesh(new THREE.PlaneGeometry(10.5,7.8),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.12}));
sh.rotation.x=-Math.PI/2;sh.position.set(0.3,-0.34,0.3);g.add(sh);
box(9.2,0.25,6.6,0xcdbb8a,0,-0.2,0);box(8.8,0.12,6.2,0xe6d9b0,0,-0.02,0);
function wire(x1,z1,x2,z2,p){
  box(Math.abs(x2-x1)||0.16,0.16,Math.abs(z2-z1)||0.16,CU,(x1+x2)/2,Y,(z1+z2)/2,p);
  [[x1,z1],[x2,z2]].forEach(function(c){var s=new THREE.Mesh(new THREE.SphereGeometry(0.15,14,10),mat(CU));s.position.set(c[0],Y,c[1]);(p||g).add(s)});
}
function mkLoop(pts){var segs=[],t=0;for(var i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);t+=l}return{segs:segs,total:t}}
function onLoop(lp,t){var s=(((t%1)+1)%1)*lp.total;
  for(var i=0;i<lp.segs.length;i++){var sg=lp.segs[i];if(s<=sg[2]){var f=s/sg[2];return[sg[0][0]+(sg[1][0]-sg[0][0])*f,sg[0][1]+(sg[1][1]-sg[0][1])*f]}s-=sg[2]}return lp.segs[0][0]}
function mkDots(n){var a=[];for(var k=0;k<n;k++){var d=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),new THREE.MeshBasicMaterial({color:0xfff0a0}));d.userData.t=k/n;d.visible=false;g.add(d);a.push(d)}return a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var drag=false,lx=0;
stage.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;stage.style.cursor='grabbing'});
addEventListener('pointerup',function(){drag=false;stage.style.cursor='grab'});
addEventListener('pointermove',function(e){if(drag){g.rotation.y+=(e.clientX-lx)*0.01;lx=e.clientX}});
function resize(){var w=stage.clientWidth,h=stage.clientHeight,asp=w/h,s=Math.max(4.9,6.0/asp);if(!w||!h)return;renderer.setSize(w,h,false);
  cam.left=-s*asp;cam.right=s*asp;cam.top=s;cam.bottom=-s;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
function bulbParts(x,z){
  cyl(0.42,0.5,0x7a7a7a,x,0.45,z);cyl(0.3,0.2,0xb9b9b9,x,0.8,z);
  var bm=mat(0xcfd8dc,{emissive:0,transparent:true,opacity:0.95});
  var b=new THREE.Mesh(new THREE.SphereGeometry(0.66,26,18),bm);b.position.set(x,1.5,z);g.add(b);
  var l=new THREE.PointLight(0xffc83d,0,8);l.position.set(x,1.7,z);g.add(l);
  return{m:bm,l:l,set:function(e){bm.emissive.setRGB(e,e*0.78,e*0.24);l.intensity=1.8*e}};
}
function battery(x,z,p){box(1.1,1.0,1.8,0x34363b,x,0.5,z,p);box(1.1,0.3,1.8,0x57b560,x,1.15,z,p);box(1.1,0.1,1.8,0xffd34e,x,0.78,z,p);cyl(0.2,0.22,0xcfcfcf,x,1.41,z,p)}
function mkLoop3(pts){var segs=[],t=0;for(var i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length],l=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);segs.push([a,b,l]);t+=l}return{segs:segs,total:t}}
function at3(lp,t){var s=(((t%1)+1)%1)*lp.total;for(var i=0;i<lp.segs.length;i++){var sg=lp.segs[i];if(s<=sg[2]){var f=sg[2]?s/sg[2]:0;return[sg[0][0]+(sg[1][0]-sg[0][0])*f,sg[0][1]+(sg[1][1]-sg[0][1])*f,sg[0][2]+(sg[1][2]-sg[0][2])*f]}s-=sg[2]}return lp.segs[0][0]}
function seg3(a,b){var dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];box(Math.abs(dx)||0.14,Math.abs(dy)||0.14,Math.abs(dz)||0.14,CU,(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);[a,b].forEach(function(c){var s=new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10),mat(CU));s.position.set(c[0],c[1],c[2]);g.add(s)})}
function spr(txt,fill,sz){var c=document.createElement('canvas');c.width=c.height=64;var q=c.getContext('2d');q.font='bold 52px sans-serif';q.textAlign='center';q.textBaseline='middle';q.lineWidth=7;q.strokeStyle='#1d1b16';q.strokeText(txt,32,34);q.fillStyle=fill;q.fillText(txt,32,34);var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(sz,sz,1);return s}
var charge=0,v=40,rub=0,pend=false;
box(1.8,0.5,1.6,0xe9e4f0,-3.4,0.25,0);
var comb=new THREE.Group();g.add(comb);
box(2.6,0.14,0.55,0x2a6fd6,0,0,0,comb);for(var i=0;i<9;i++)box(0.07,0.28,0.4,0x2a6fd6,-1.1+i*0.275,-0.2,0,comb);
var signs=[];for(i=0;i<8;i++){var s=spr('−','#ffffff',0.38);s.position.set(-1.0+i*0.29,0.3,0);comb.add(s);signs.push(s)}
var XS=[-1.1,-0.6,-0.2,0.2,0.6,1.0,-0.8,0.4],ZS=[0.3,-0.3,0.4,-0.1,0.3,-0.35,-0.45,-0.6];
var bits=XS.map(function(x,i){var m=box(0.3,0.03,0.3,0xfff6e0,x,0.09,ZS[i]);m.rotation.y=i*0.7;m.userData.w=0.25+0.07*i;var p=spr('+','#ff5a4a',0.34);p.visible=false;g.add(p);m.userData.p=p;m.userData.lift=false;return m});
comb.position.set(0,3.4-1.95*v/100,0);
var cx=0,lastTxt='';
function ui(){$('dv').textContent=v+'%'}
$('rub').onclick=function(){if(rub<=0){rub=0.9;pend=true}};
$('dist').oninput=function(){v=+this.value;ui()};
$('dis').onclick=function(){charge=0};ui();
function update(dt,t){
  if(rub>0){rub-=dt;if(rub<=0&&pend){pend=false;charge=Math.min(1,charge+0.34)}}
  charge=Math.max(0,charge-dt*0.03);
  var hT=3.4-1.95*v/100,k=Math.min(1,dt*8);
  var tx=rub>0?-3.4+Math.sin(rub*22)*0.5:0,ty=rub>0?0.78:hT;
  comb.position.x+=(tx-comb.position.x)*k;comb.position.y+=(ty-comb.position.y)*k;
  var n=Math.ceil(charge*8-1e-6);signs.forEach(function(s,i){s.visible=i<n});
  var force=rub>0?0:charge*(0.2+0.8*Math.pow(v/100,1.2))*1.7,cnt=0;
  bits.forEach(function(m,i){
    var lift=force>m.userData.w;if(lift)cnt++;m.userData.lift=lift;
    var bx=lift?comb.position.x+(i-3.5)*0.27:XS[i],by=lift?comb.position.y-0.5+Math.sin(t*6+i)*0.02:0.09,bz=lift?Math.sin(i*2)*0.12:ZS[i],kk=Math.min(1,dt*6);
    m.position.x+=(bx-m.position.x)*kk;m.position.y+=(by-m.position.y)*kk;m.position.z+=(bz-m.position.z)*kk;
    var p=m.userData.p;p.visible=lift;p.position.set(m.position.x,m.position.y+0.3,m.position.z)});
  var txt=Math.round(charge*100)+'|'+cnt+'|'+(rub>0);
  if(txt!==lastTxt){lastTxt=txt;
    $('a').textContent='Charge: '+Math.round(charge*100)+'%';$('b').textContent='Paper lifted: '+cnt+' of 8';
    $('fill').style.width=charge*100+'%';$('fill').style.background='#3a73d6';
    $('cap').textContent=rub>0?'Rubbing moves tiny negative charges from the wool onto the comb.'
     :charge<0.02?'The comb has no charge yet. Rub it on the wool a few times.'
     :cnt>0?'The charged comb pulls on the neutral paper bits and lifts the lightest ones first. Charge slowly leaks away, so the paper falls again.'
     :'The comb is charged. Bring it closer to the paper, or rub it more.'}
}
var clock=new THREE.Clock();
(function loop(){var dt=Math.min(clock.getDelta(),0.1),t=clock.elapsedTime;update(dt,t);g.position.y=Math.sin(t*1.2)*0.04;renderer.render(scene,cam);requestAnimationFrame(loop)})();
})();
</script>
</body>
</html>
