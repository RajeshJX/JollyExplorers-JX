<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuse and Overload</title>
<style>
:root{--bg:#f6efde;--ink:#1d1b16;--muted:#6b6455;--card:#fffaf0;--accent:#f2b400;--line:#e3d8bd;--chip:#efe5cb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--ink:#f3ecd9;--muted:#a79f8a;--card:#221f16;--accent:#ffc83d;--line:#2d2a1e;--chip:#2e2a1c}}
:root[data-theme="dark"]{--bg:#17150f;--ink:#f3ecd9;--muted:#a79f8a;--card:#221f16;--accent:#ffc83d;--line:#2d2a1e;--chip:#2e2a1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:16px 18px 0}
h1{margin:0;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
header p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#stage{flex:1;min-height:300px;position:relative;touch-action:none;cursor:grab;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
.panel{margin:0 12px 12px;padding:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);color:#1d1b16}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slots button{font:inherit;font-weight:700;font-size:13px;padding:10px 4px;border-radius:10px;border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);cursor:pointer}
.slots button.off{opacity:.45;border-style:dashed}
.stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stats span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--chip);border:1.5px solid var(--line)}
#cap{margin:10px 2px 0;font-size:13.5px;line-height:1.5}
small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 0}
@media (min-width:900px){body{height:100vh;display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;overflow:hidden}header{grid-column:1/-1}#stage{min-height:0}.panel{margin:12px 12px 12px 0;align-self:start;max-height:100%;overflow:auto}}

.gauge{height:16px;border-radius:99px;background:var(--chip);border:1.5px solid var(--line);position:relative;overflow:hidden;margin-top:10px}
#fill{height:100%;width:0;background:#4caf50;transition:width .25s,background .25s}
#mark{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.main{font:inherit;font-weight:700;width:100%;padding:12px;margin-top:10px;border-radius:12px;border:2px solid var(--ink);background:var(--accent);color:#1d1b16;cursor:pointer;font-size:15px}
.main:disabled{opacity:.35}
</style>

</head>
<body>
<header><h1>How It’s Wired</h1><p>Simulator 3 · The fuse and overload</p></header>
<div id="stage"><div id="hint">Drag to rotate</div></div>
<div class="panel">
<div class="seg"><button id="f5" class="on">5 A fuse</button><button id="f13">13 A fuse</button></div>
<small>Tap an appliance to switch it on or off</small>
<div class="slots"><button id="s0" class="off">Lamp 1 A</button><button id="s1" class="off">Fan 2 A</button><button id="s2" class="off">Heater 4 A</button></div>
<div class="gauge"><div id="fill"></div><div id="mark"></div></div>
<div class="stats"><span id="a"></span><span id="b"></span></div>
<button class="main" id="rep" disabled>Replace fuse</button>
<p id="cap"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var stage=$('stage'),AMP=[1,2,4],MAX=13,rating=5,on=[false,false,false],blown=false,heat=0,flash=0;
var scene=new THREE.Scene();
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
var cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
cam.position.set(9,8,9);cam.lookAt(0,0.5,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8a97c,0.85));
var sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(5,10,4);scene.add(sun);
var g=new THREE.Group();scene.add(g);
var EDGE=new THREE.LineBasicMaterial({color:0x2a2418});
function mat(c,o){return new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}))}
function add(m,x,y,z,p){m.position.set(x,y,z);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,40),EDGE));(p||g).add(m);return m}
function box(w,h,d,c,x,y,z,p){return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)),x,y,z,p)}
function cyl(r,h,c,x,y,z,p){return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),mat(c)),x,y,z,p)}
var W=3,D=2,Y=0.35,CU=0xd9822b;
var sh=new THREE.Mesh(new THREE.PlaneGeometry(10.5,7.8),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.12}));
sh.rotation.x=-Math.PI/2;sh.position.set(0.3,-0.34,0.3);g.add(sh);
box(9.2,0.25,6.6,0xcdbb8a,0,-0.2,0);box(8.8,0.12,6.2,0xe6d9b0,0,-0.02,0);
function wire(x1,z1,x2,z2){
  box(Math.abs(x2-x1)||0.16,0.16,Math.abs(z2-z1)||0.16,CU,(x1+x2)/2,Y,(z1+z2)/2);
  [[x1,z1],[x2,z2]].forEach(function(c){var s=new THREE.Mesh(new THREE.SphereGeometry(0.15,14,10),mat(CU));s.position.set(c[0],Y,c[1]);g.add(s)});
}
var XS=[0.2,1.6,3];
wire(-W,D,3,D);wire(-W,-D,3,-D);wire(-W,D,-W,-D);
XS.forEach(function(x){wire(x,D,x,-D)});
// battery (mains)
box(1.1,1.0,1.8,0x34363b,-W,0.5,0);box(1.1,0.3,1.8,0x57b560,-W,1.15,0);box(1.1,0.1,1.8,0xffd34e,-W,0.78,0);cyl(0.2,0.22,0xcfcfcf,-W,1.41,0);

// fuse on the front rail
var fx=-1.5,fuse=new THREE.Group();fuse.position.set(fx,Y+0.35,D);g.add(fuse);
var glassMat=new THREE.MeshLambertMaterial({color:0xcfe8f0,transparent:true,opacity:0.5});
var glass=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,1.5,24),glassMat);glass.rotation.z=Math.PI/2;fuse.add(glass);
[-0.8,0.8].forEach(function(x){var c=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.22,20),mat(0xb9b9b9));c.rotation.z=Math.PI/2;c.position.x=x;fuse.add(c)});
var fil=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,0.05),new THREE.MeshLambertMaterial({color:0xdddddd,emissive:0x000000}));fuse.add(fil);
var stubL=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.05,0.05),mat(0x777777));stubL.position.x=-0.6;stubL.visible=false;fuse.add(stubL);
var stubR=stubL.clone();stubR.position.x=0.6;fuse.add(stubR);
var spark=new THREE.PointLight(0xff8a30,0,7);spark.position.set(0,0.4,0);fuse.add(spark);

// appliances: lamp, fan, heater
var bm=mat(0xcfd8dc,{emissive:0,transparent:true,opacity:0.95});
cyl(0.42,0.5,0x7a7a7a,XS[0],0.45,0);cyl(0.3,0.2,0xb9b9b9,XS[0],0.8,0);
var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.66,26,18),bm);bulb.position.set(XS[0],1.5,0);g.add(bulb);
var lamp=new THREE.PointLight(0xffc83d,0,8);lamp.position.set(XS[0],1.7,0);g.add(lamp);
cyl(0.55,0.4,0x8a8a8a,XS[1],0.4,0);cyl(0.08,1.0,0x777777,XS[1],1.1,0);
var blades=new THREE.Group();blades.position.set(XS[1],1.7,0);g.add(blades);
[0,2.09,4.19].forEach(function(a){var b=box(1.1,0.05,0.3,0x4aa3df,0,0,0,blades);b.position.set(Math.cos(a)*0.55,0,Math.sin(a)*0.55);b.rotation.y=-a});
box(1.2,0.9,1.2,0x9a9a9a,XS[2],0.45,0);
var coilMat=mat(0x552211,{emissive:0});
[-0.3,0,0.3].forEach(function(z){var c=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.08,0.1),coilMat);c.position.set(XS[2],0.55,z);g.add(c)});
// current dots
var loops=XS.map(function(x){var pts=[[-W,D],[x,D],[x,-D],[-W,-D]],segs=[],t=0;
  for(var i=0;i<4;i++){var a=pts[i],b=pts[(i+1)%4],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);t+=l}return{segs:segs,total:t}});
var dots=[];
for(var k=0;k<42;k++){var d=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),new THREE.MeshBasicMaterial({color:0xfff0a0}));d.userData.t=(k%14)/14;d.visible=false;g.add(d);dots.push(d)}
function place(d,lp){var s=d.userData.t*lp.total;
  for(var i=0;i<4;i++){var sg=lp.segs[i];if(s<=sg[2]){var f=s/sg[2];d.position.set(sg[0][0]+(sg[1][0]-sg[0][0])*f,Y+0.22,sg[0][1]+(sg[1][1]-sg[0][1])*f);return}s-=sg[2]}}

function total(){return on.reduce(function(s,v,i){return s+(v?AMP[i]:0)},0)}
function ui(){
  var t=blown?0:total();
  $('f5').className=rating===5?'on':'';$('f13').className=rating===13?'on':'';
  for(var i=0;i<3;i++)$('s'+i).className=on[i]?'':'off';
  $('fill').style.width=Math.min(100,t/MAX*100)+'%';
  $('fill').style.background=t>rating?'#e0452f':'#4caf50';
  $('mark').style.left=(rating/MAX*100)+'%';
  $('a').textContent='Current: '+t+' A';$('b').textContent='Fuse rating: '+rating+' A';
  $('rep').disabled=!blown;
  var T=total();
  $('cap').textContent=blown?'The fuse blew. Its thin wire melted, which cut the circuit and protected the wiring. Replace the fuse, then switch something off before turning it on again.'
    :T>rating?'Too much current for this fuse. Its thin wire is heating up and will melt in a moment.'
    :T===0?'Switch on some appliances. Each one draws current, and the fuse has to carry all of it.'
    :rating===13&&T>5?'The 13 A fuse allows more current. That is fine for big appliances, but a fuse that is too large will not protect thin wires.'
    :'The current is below the fuse rating, so the fuse stays intact.';
}
function reset(){blown=false;heat=0;fil.visible=true;stubL.visible=stubR.visible=false;glassMat.color.setHex(0xcfe8f0);ui()}
$('f5').onclick=function(){rating=5;reset()};$('f13').onclick=function(){rating=13;reset()};
[0,1,2].forEach(function(i){$('s'+i).onclick=function(){on[i]=!on[i];ui()}});
$('rep').onclick=reset;ui();

var drag=false,lx=0;
stage.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;stage.style.cursor='grabbing'});
addEventListener('pointerup',function(){drag=false;stage.style.cursor='grab'});
addEventListener('pointermove',function(e){if(drag){g.rotation.y+=(e.clientX-lx)*0.01;lx=e.clientX}});
function resize(){var w=stage.clientWidth,h=stage.clientHeight,s=5.8,asp=w/h;renderer.setSize(w,h,false);
  cam.left=-s*asp;cam.right=s*asp;cam.top=s;cam.bottom=-s;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

var clock=new THREE.Clock(),e=[0,0,0];
(function loop(){
  var dt=clock.getDelta(),t=clock.elapsedTime,T=total();
  if(!blown){
    if(T>rating)heat+=dt*(T/rating-0.8);else heat=Math.max(0,heat-dt*0.9);
    if(heat>=1){blown=true;flash=1;fil.visible=false;stubL.visible=stubR.visible=true;glassMat.color.setHex(0x5a4638);ui()}
    var h=Math.min(1,heat);fil.material.emissive.setRGB(h,h*0.35,0);fil.material.color.setRGB(0.87,0.87-h*0.5,0.87-h*0.7);
  }
  flash=Math.max(0,flash-dt*2.5);spark.intensity=flash*3;
  var live=!blown;
  for(var i=0;i<3;i++)e[i]+=((live&&on[i]?1:0)-e[i])*Math.min(1,dt*7);
  bm.emissive.setRGB(e[0],e[0]*0.78,e[0]*0.24);lamp.intensity=1.8*e[0];
  blades.rotation.y+=dt*12*e[1];
  coilMat.emissive.setRGB(e[2],e[2]*0.3,0);coilMat.color.setRGB(0.33+e[2]*0.6,0.13+e[2]*0.2,0.07);
  dots.forEach(function(d,k){var li=Math.floor(k/14);
    if(!(live&&on[li])){d.visible=false;return}
    d.visible=true;d.userData.t=(d.userData.t+dt*1.6/loops[li].total)%1;place(d,loops[li])});
  g.position.y=Math.sin(t*1.2)*0.04;
  renderer.render(scene,cam);requestAnimationFrame(loop);
})();
})();
</script>
</body>
</html>
